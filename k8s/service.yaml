apiVersion: v1
kind: Service
metadata:
  name: mlflow-service
  labels:
    app: mlflow
spec:
  # ClusterIP (default, internal-only) on purpose - the tracking server has no reason
  # to be reachable from outside the cluster, and keeping it internal-only reduces
  # attack surface. Only the api Deployment talks to it, over the cluster network.
  type: ClusterIP
  selector:
    app: mlflow
  ports:
    - port: 5000
      targetPort: 5000

---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  labels:
    app: football-outcome-api
spec:
  # LoadBalancer: this is the service a real client (or an Ingress in front of it)
  # would call. On a cloud-managed cluster this provisions an external IP; on a local
  # cluster (minikube/kind) it stays pending / falls back to NodePort-style access.
  type: LoadBalancer
  selector:
    app: football-outcome-api
  ports:
    - port: 80
      targetPort: 8000
