name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt
      - run: black --check src/ tests/ dags/ frontend/
      - run: ruff check src/ tests/ dags/ frontend/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt

      # Registering against a real mlflow server (not a bare sqlite:// file, which
      # is what a plain `mlflow.set_experiment(...)` call uses by default) makes
      # new experiments get the proxied "mlflow-artifacts:/" scheme instead of an
      # absolute host filesystem path baked into mlflow.db. That's required for
      # the model to be loadable later from inside a container - see ADR-014.
      - name: Start MLflow server
        run: |
          mlflow server --backend-store-uri sqlite:///mlflow.db --artifacts-destination ./mlruns --host 127.0.0.1 --port 5000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5000 > /dev/null && exit 0
            sleep 1
          done
          echo "MLflow server did not start in time" && exit 1

      - name: Run pipeline (ingest -> validate -> train -> registry)
        env:
          MLFLOW_TRACKING_URI: http://127.0.0.1:5000
        run: |
          python -m src.data.ingest
          python -m src.data.validate
          python -m src.models.train
          python -m src.models.registry

      - name: Run tests
        env:
          MLFLOW_TRACKING_URI: http://127.0.0.1:5000
        run: pytest

  docker:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt

      - name: Build images
        run: docker compose build

      # docker-compose.yml bind-mounts ./mlflow.db as a file. On a fresh checkout
      # that path doesn't exist yet, and Docker's default behavior for a missing
      # bind-mount source is to create a *directory* there instead of a file -
      # mlflow then fails with "unable to open database file" because the sqlite
      # backend finds a directory where a file should be. See ADR-019.
      - name: Ensure mlflow.db exists before mounting it
        run: touch mlflow.db

      - name: Start MinIO + MLflow
        run: docker compose up -d minio minio-init mlflow

      - name: Wait for MLflow health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000 > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "MLflow did not become healthy in time"
          docker compose logs
          exit 1

      # Registers a real model against the docker-composed, MinIO-backed mlflow -
      # proves artifacts genuinely round-trip through S3-compatible storage, not
      # just that the containers started. See ADR-019.
      - name: Run pipeline against the containerized MLflow (writes to MinIO)
        env:
          MLFLOW_TRACKING_URI: http://localhost:5000
        run: |
          python -m src.data.ingest
          python -m src.data.validate
          python -m src.models.train
          python -m src.models.registry

      - name: Start API
        run: docker compose up -d api

      - name: Wait for API health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          echo "API did not become healthy in time"
          docker compose logs
          exit 1

      - name: Smoke test /predict
        run: |
          curl -sf -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"home_team":"Arsenal","away_team":"Chelsea","match_date":"2026-08-15","b365h":2.1,"b365d":3.4,"b365a":3.2}'

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag football-outcome-mlops-api:latest ghcr.io/${{ github.repository_owner }}/football-outcome-mlops-api:latest
          docker push ghcr.io/${{ github.repository_owner }}/football-outcome-mlops-api:latest

  airflow:
    # Independent of lint/test/docker (doesn't need their outputs) - runs in
    # parallel to keep overall CI wall-clock time down.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Airflow image
        run: docker compose -f docker-compose.airflow.yml build

      - name: Start Airflow
        run: docker compose -f docker-compose.airflow.yml up -d

      - name: Wait for Airflow webserver
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/health > /dev/null; then exit 0; fi
            sleep 5
          done
          echo "Airflow did not become healthy in time"
          docker compose -f docker-compose.airflow.yml logs
          exit 1

      # The real DAG (ingest -> validate -> train 4 models -> evaluate -> promote)
      # takes several minutes - this proves the whole thing actually runs inside
      # Airflow, not just that the DAG file parses. Budget bumped from 15 to 40
      # minutes: training now includes an ensemble member and wider
      # hyperparameter grids (ADR-027) than when the original 15-minute budget
      # was set, and unpausing the DAG for the first time also kicks off
      # Airflow's own latest-due scheduled run alongside the manual trigger -
      # both compete for the same limited executor.
      - name: Trigger the DAG and wait for it to finish
        run: |
          docker compose -f docker-compose.airflow.yml exec -T airflow airflow dags unpause football_retrain_pipeline
          docker compose -f docker-compose.airflow.yml exec -T airflow airflow dags trigger football_retrain_pipeline
          for i in $(seq 1 160); do
            OUTPUT=$(docker compose -f docker-compose.airflow.yml exec -T airflow airflow dags list-runs -d football_retrain_pipeline -o plain)
            echo "$OUTPUT"
            if echo "$OUTPUT" | grep -q "success"; then echo "DAG run succeeded"; exit 0; fi
            if echo "$OUTPUT" | grep -q "failed"; then echo "DAG run failed"; exit 1; fi
            sleep 15
          done
          echo "DAG did not complete in time"
          exit 1

      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker-compose.airflow.yml logs

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.airflow.yml down -v
