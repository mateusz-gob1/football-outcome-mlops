name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt
      - run: black --check src/ tests/
      - run: ruff check src/ tests/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt

      # Registering against a real mlflow server (not a bare sqlite:// file, which
      # is what a plain `mlflow.set_experiment(...)` call uses by default) makes
      # new experiments get the proxied "mlflow-artifacts:/" scheme instead of an
      # absolute host filesystem path baked into mlflow.db. That's required for
      # the model to be loadable later from inside a container - see ADR-014.
      - name: Start MLflow server
        run: |
          mlflow server --backend-store-uri sqlite:///mlflow.db --artifacts-destination ./mlruns --host 127.0.0.1 --port 5000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5000 > /dev/null && exit 0
            sleep 1
          done
          echo "MLflow server did not start in time" && exit 1

      - name: Run pipeline (ingest -> validate -> train -> registry)
        env:
          MLFLOW_TRACKING_URI: http://127.0.0.1:5000
        run: |
          python -m src.data.ingest
          python -m src.data.validate
          python -m src.models.train
          python -m src.models.registry

      - name: Run tests
        env:
          MLFLOW_TRACKING_URI: http://127.0.0.1:5000
        run: pytest

      # The "production"-aliased model lives in mlflow.db/mlruns (both gitignored -
      # see vault/Architecture-Decisions.md ADR-011). The docker job needs it too.
      - name: Upload MLflow store
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-store
          path: |
            mlflow.db
            mlruns/

  docker:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download MLflow store
        uses: actions/download-artifact@v4
        with:
          name: mlflow-store
          path: .

      - name: Build images
        run: docker compose build

      - name: Start containers
        run: docker compose up -d

      - name: Wait for API health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          echo "API did not become healthy in time"
          docker compose logs
          exit 1

      - name: Smoke test /predict
        run: |
          curl -sf -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"home_team":"Arsenal","away_team":"Chelsea","match_date":"2026-08-15","b365h":2.1,"b365d":3.4,"b365a":3.2}'

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag football-outcome-mlops-api:latest ghcr.io/${{ github.repository_owner }}/football-outcome-mlops-api:latest
          docker push ghcr.io/${{ github.repository_owner }}/football-outcome-mlops-api:latest
