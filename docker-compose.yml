services:
  mlflow:
    build: .
    image: football-outcome-mlops-mlflow:latest
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow.db:/app/mlflow.db
      - ./mlruns:/app/mlruns
    command:
      [
        "mlflow", "server",
        "--backend-store-uri", "sqlite:///mlflow.db",
        # --artifacts-destination (not --default-artifact-root) is what makes the
        # server proxy artifact bytes over HTTP (mlflow-artifacts:/ scheme) instead
        # of clients needing direct filesystem access to an absolute host path -
        # see ADR-014. --default-artifact-root only affects brand-new experiments
        # and doesn't fix ones already created outside a server.
        "--artifacts-destination", "./mlruns",
        "--host", "0.0.0.0",
        "--port", "5000",
        # Without this, MLflow's DNS-rebinding protection rejects requests whose
        # Host header is the Compose service name ("mlflow") instead of an IP or
        # "localhost" - which is exactly how the api container reaches it. The
        # check matches the Host header verbatim, port included, so both the
        # bare and ":5000"-qualified forms are needed (our own healthcheck below
        # sends "localhost:5000" and was rejected until this was added too).
        "--allowed-hosts", "mlflow,mlflow:5000,localhost,localhost:5000",
      ]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build: .
    image: football-outcome-mlops-api:latest
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      mlflow:
        condition: service_healthy
